services:
  # service: Kafka broker ( in KRaft mode – no ZooKeeper)
  broker:
    image: apache/kafka:3.9.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      # KRaft / single-node settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners: DOCKER for inter-container, HOST for host machine, CONTROLLER for KRaft
      KAFKA_LISTENERS: DOCKER://0.0.0.0:19092,CONTROLLER://localhost:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: DOCKER://broker:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Topic initialisation (runs once, then exits)
  init-topics:
    image: apache/kafka:3.9.0
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command:
      - --create
      - --if-not-exists
      - --topic
      - topic_raw_temp_sensor_values
      - --bootstrap-server
      - broker:19092
      - --partitions
      - "2"
      - --replication-factor
      - "1"

  # Producer
  producer:
    build: .
    container_name: producer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    command:
      - python
      - src/producer.py
      - --brokers
      - broker:19092
      - --topic
      - topic_raw_temp_sensor_values
      - --rate
      - "1"

  # Consumer
  consumer:
    build: .
    container_name: consumer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    command:
      - python
      - src/consumer.py
      - --brokers
      - broker:19092
      - --topic
      - topic_raw_temp_sensor_values
